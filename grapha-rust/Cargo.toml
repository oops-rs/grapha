[package]
name = "grapha-rust"
version = "0.4.0"
edition = "2024"
publish = false
description = "Rust extractor for Grapha based on tree-sitter"
license = "MIT"
repository = "https://github.com/oops-rs/grapha"
homepage = "https://github.com/oops-rs/grapha"
readme = "../README.md"
keywords = ["code-intelligence", "graph", "analysis", "rust", "tree-sitter"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
grapha-core = { version = "0.4.0", path = "../grapha-core" }
anyhow = "1"
regex = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
toml = "1"

[dev-dependencies]
tempfile = "3"
