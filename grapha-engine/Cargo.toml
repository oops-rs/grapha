[package]
name = "grapha-engine"
version = "0.4.1"
edition = "2024"
publish = false
description = "Library engine for Grapha code intelligence"
license = "MIT"
repository = "https://github.com/oops-rs/grapha"
homepage = "https://github.com/oops-rs/grapha"
readme = "../README.md"
keywords = ["code-intelligence", "graph", "analysis", "search", "query"]
categories = ["development-tools"]

[dependencies]
grapha-core = { version = "0.4.1", path = "../grapha-core" }
grapha-rust = { version = "0.4.1", path = "../grapha-rust" }
grapha-swift = { version = "0.4.1", path = "../grapha-swift", optional = true }
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
ignore = "0.4"
indicatif = "0.18"
git2 = { version = "0.20", default-features = false }
langcodec = "0.12"
notify = "8.2"
notify-debouncer-mini = "0.7"
rayon = "1"
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26"
thiserror = "2"
toml = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-pascal = "0.10"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-typescript = "0.23"
urlencoding = "2"
xcassets = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
swift = ["dep:grapha-swift"]
