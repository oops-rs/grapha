[package]
name = "grapha-swift"
version = "0.4.2"
edition = "2024"
description = "Tree-sitter Swift extraction with optional IndexStore and SwiftSyntax optimization"
license = "MIT"
repository = "https://github.com/oops-rs/grapha"
homepage = "https://github.com/oops-rs/grapha"
readme = "../README.md"
keywords = ["code-intelligence", "graph", "analysis", "swift", "tree-sitter"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
grapha-core = { version = "0.4.2", path = "../grapha-core" }
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-swift = "0.7"
regex = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"

[features]
default = []
# Opt in to the macOS/Xcode-specific extraction waterfall. Without this feature,
# `grapha-swift` always parses Swift with tree-sitter and does not build or load
# the Swift bridge.
swift-optimizations = []

[dev-dependencies]
tempfile = "3"
